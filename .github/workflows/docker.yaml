name: doker
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        container: golang:1.24.2
        steps:
          - uses: actions/checkout@v4

          - name: Install dependencies
            run: go mod tidy

          - name: Run Unit Tests
            run: |
              CGO_ENABLED=0 GOOS=linux go run main.go &
              sleep 100
              go test -run ^TestApp$ ./tests
            

